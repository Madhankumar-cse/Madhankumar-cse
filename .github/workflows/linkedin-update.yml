name: Update LinkedIn Post

on:
  schedule:
    - cron: "0 * * * *"   # Every 1 hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest LinkedIn post
        run: |
          curl -L "https://rss-bridge.org/bridge01/?action=display&bridge=LinkedIn&u=mkmadhan007&format=Json" -o linkedin.json || true

      - name: Update README
        run: |
          python << 'EOF'
          import json,re

          readme=open("README.md","r",encoding="utf-8").read()

          text="No recent LinkedIn post found."

          try:
              data=json.load(open("linkedin.json",encoding="utf-8"))

              if "items" in data and len(data["items"])>0:
                  item=data["items"][0]
                  title=item.get("title","Latest LinkedIn Post")
                  link=item.get("url","#")
                  text=f"🚀 **[{title}]({link})**"
          except:
              pass

          pattern=r"<!-- LINKEDIN_POST_START -->.*?<!-- LINKEDIN_POST_END -->"

          replacement=f"""<!-- LINKEDIN_POST_START -->
          {text}
          <!-- LINKEDIN_POST_END -->"""

          readme=re.sub(pattern,replacement,readme,flags=re.S)

          open("README.md","w",encoding="utf-8").write(readme)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Auto update LinkedIn post"
          git push
